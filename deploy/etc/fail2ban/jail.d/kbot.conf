# kbot (02 §9, stage E4a): ban an address after repeated SSH failures. The security list of
# Oracle already admits SSH only from the owner's address, so this is a second layer. The
# bans go to iptables, the firewall of the image, in the form kbot.ops.check expects.
[sshd]
enabled = true
backend = systemd
banaction = iptables-multiport
maxretry = 5
findtime = 10m
bantime = 1h
