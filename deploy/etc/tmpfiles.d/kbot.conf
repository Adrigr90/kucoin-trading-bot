# kbot (02 §13.1, E4-D06): the lock of the single KuCoin REST budget of the machine
# (KBOT_REST_LOCK). Created at boot, owned by root: the services of group kbot can open
# it to read and write, but cannot create, remove or replace anything in the directory.
d /run/kbot 0750 root kbot -
f /run/kbot/kucoin-rest.lock 0660 root kbot -
