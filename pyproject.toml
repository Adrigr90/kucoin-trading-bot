[project]
name = "kucoin-trading-bot"
version = "0.1.0"
description = "Bot de análisis y paper trading en KuCoin. Sin dinero real, sin órdenes reales y sin claves."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=26,<27",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.1",
    "websockets>=14,<17",
]

[dependency-groups]
dev = [
    "duckdb>=2,<3",
    "hypothesis>=6.100",
    "pglast>=8,<9",
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbot"]

[tool.uv]
# Supply chain (02 §9): resolve only releases published at least one week before
# the lock was created. Move this date forward deliberately when updating dependencies.
exclude-newer = "2026-10-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "db: needs the ephemeral PostgreSQL 18 of the CI (KBOT_TEST_DB=1)",
    "tools: needs external CI tools such as gitleaks or openssl",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607", "S608"]
"tools/**" = ["S603", "S607"]
