# kbot: PostgreSQL 18 of production (02 §9 and §13.1, stage E4b). Installed as
# /etc/postgresql/18/main/conf.d/kbot.conf by deploy/install/02_postgresql.sh.

# No TCP listener: connections are only possible through the Unix socket, with peer.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'

# Stage E3 (02 §3.9): a query over a table partitioned by day locks every partition it
# cannot prune, with its indexes; about 1,250 live partitions with 90 days kept.
max_locks_per_transaction = 256

# Memory, for the instance of 12 GB (02 §13): measured again in E5 against the metric of
# Oracle. The rest of the memory serves as page cache.
shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 256MB

# The WAL reserve of the projection (02 §13.1, point 4): max_wal_size is a soft limit.
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = zstd

# Connections: every role has its own small limit (sql/roles.sql); a few spare for the
# administrator and the restoration tests.
max_connections = 60

# Logging to the journal through stderr/syslog of the cluster, in UTC, with slow queries
# and every DDL, so that the catalog never changes unnoticed.
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 2000
log_statement = 'ddl'
log_checkpoints = on
log_lock_waits = on
log_connections = on
log_disconnections = on

# Autovacuum stays on; the partitions are small and insert-only.
autovacuum = on
