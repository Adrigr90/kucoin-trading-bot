# kbot (02 §9 and §13.1, stage E4a). Ubuntu reads this directory before its own settings,
# and sshd keeps the first value it reads, so these win over the image's defaults.
# Only key authentication, never root, and only the administrator of the image.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ubuntu
# No forwarding of any kind until a stage needs it (the panel of F7 will, through D06).
DisableForwarding yes
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
