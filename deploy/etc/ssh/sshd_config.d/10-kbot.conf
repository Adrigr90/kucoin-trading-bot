# kbot (02 §9 and §13.1, stage E4a). Ubuntu reads this directory before its own settings,
# and sshd keeps the first value it reads, so these win over the image's defaults.
# Only key authentication, never root, and only the administrator of the image and, from
# stage E4c-3, kbot_sync, the SFTP user of the owner's external disk (02 §13.1, point 4).
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ubuntu kbot_sync
# No forwarding of any kind until a stage needs it (the panel of F7 will, through D06).
DisableForwarding yes
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Stage E4c-3 (02 §13.1, point 4): kbot_sync only gets SFTP inside its chroot, with its own
# key, no TTY and no forwarding of any kind. Files it creates are 0640; it may not create
# links, so nothing in recibos/ can point the verifier elsewhere. Its directory of keys is
# root's: /etc/kbot/kbot_sync_authorized_keys holds the public key of the owner's PC only.
# This block must stay the last one of the file: a Match block runs to the end.
Match User kbot_sync
	ForceCommand internal-sftp -u 0027 -P symlink,hardlink
	ChrootDirectory /srv/kbot/sftp
	AuthorizedKeysFile /etc/kbot/kbot_sync_authorized_keys
	AuthenticationMethods publickey
	PasswordAuthentication no
	PermitTTY no
	DisableForwarding yes
	PermitTunnel no
